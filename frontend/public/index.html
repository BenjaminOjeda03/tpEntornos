<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Entornos - Tareas</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
     <div id="root"></div>
  <div id="app" class="max-w-xl mx-auto mt-10 p-5 bg-white rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Gestor de Tareas</h1>
    <form id="taskForm" class="mb-4">
      <input type="text" id="titulo" placeholder="Título" class="border p-2 rounded w-full mb-2" required>
      <select id="estado" class="border p-2 rounded w-full mb-2">
        <option value="ToDo">ToDo</option>
        <option value="Doing">Doing</option>
        <option value="Done">Done</option>
      </select>
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Agregar Tarea</button>
    </form>
    <ul id="taskList" class="space-y-2"></ul>
  </div>
  <script src="./app.js"></script>
</body>
</html>
